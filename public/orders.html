<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Theo dõi đơn hàng và đánh giá sản phẩm đã mua tại NodeShop">
    <title>Đơn hàng của tôi | NodeShop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/my-orders.css">
</head>

<body class="home">
    <!-- BIỂU TƯỢNG (lucide) cho giỏ hàng và phân trang của catalog-renderer -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-shopping-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
            <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
            <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        </defs>
    </svg>

    <!-- KHỐI 1: THANH ĐIỀU HƯỚNG -->
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-brand">NodeShop</a>
            <nav class="site-nav" aria-label="Chính">
                <a href="/">Trang chủ</a>
                <a href="/catalog.html">Sản phẩm</a>
            </nav>
            <ul class="site-header__actions">
                <li>
                    <a href="/cart.html" class="cart-nav-link" aria-label="Giỏ hàng">
                        <svg class="icon icon--20" aria-hidden="true"><use href="#i-shopping-cart"/></svg>
                        <span class="cart-badge cart-badge--hidden" id="cart-badge">0</span>
                    </a>
                </li>
                <li class="auth-nav" data-auth-nav aria-live="polite"></li>
            </ul>
        </div>
    </header>

    <main class="shop-main" id="main">
        <div class="shop-wrap mo" data-mo data-view="list" data-auth="checking">
            <!-- KHỐI 2: ĐẦU TRANG -->
            <div class="mo-head" data-mo-head>
                <h1 id="mo-title" tabindex="-1">Đơn hàng của tôi</h1>
            </div>

            <!-- Khách chưa đăng nhập, tài khoản quản trị -->
            <section class="mo-card mo-gate" data-mo-gate hidden aria-labelledby="mo-gate-title"></section>

            <div class="mo-body" data-mo-body>
                <!-- KHỐI 3: LỌC THEO TRẠNG THÁI -->
                <div class="mo-chips-block" data-mo-chips></div>

                <div class="mo-grid" data-mo-grid>
                    <div class="mo-left">
                        <!-- KHỐI 4: DANH SÁCH ĐƠN + KHỐI 5: PHÂN TRANG -->
                        <section class="mo-card mo-list" aria-label="Danh sách đơn hàng" tabindex="-1" data-mo-list-card>
                            <div data-mo-list></div>
                            <div class="catalog-pagination" data-mo-pager></div>
                        </section>
                    </div>
                    <!-- KHỐI 6-9: CHI TIẾT MỘT ĐƠN -->
                    <div class="mo-right" data-mo-right></div>
                </div>
            </div>

            <p class="sr-only" role="status" aria-live="polite" data-mo-live></p>
        </div>
    </main>

    <!-- KHỐI 10: CHÂN TRANG -->
    <footer class="site-footer">
        <div class="site-footer__inner"><p>© 2026 NodeShop</p></div>
    </footer>

    <script src="/js/catalog-taxonomy.js"></script>
    <script src="/js/catalog-renderer.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/ui-icons.js"></script>
    <script src="/js/vat.js"></script>
    <script src="/js/my-orders.js"></script>
</body>

</html>
