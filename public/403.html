<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khu vực không được phép truy cập">
    <title>Không có quyền | NodeShop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <!-- BIỂU TƯỢNG (lucide) cho thanh điều hướng -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-shopping-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
        </defs>
    </svg>

    <!-- THANH ĐIỀU HƯỚNG -->
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-brand">NodeShop</a>
            <nav class="site-nav" aria-label="Chính">
                <a href="/">Trang chủ</a>
            </nav>
            <ul class="site-header__actions">
                <li>
                    <a href="/cart.html" class="cart-nav-link" aria-label="Giỏ hàng">
                        <svg class="icon icon--20" aria-hidden="true"><use href="#i-shopping-cart"/></svg>
                        <span class="cart-badge cart-badge--hidden" id="cart-badge">0</span>
                    </a>
                </li>
                <li class="auth-nav" data-auth-nav aria-live="polite"></li>
            </ul>
        </div>
    </header>
    <main class="state-main" data-forbidden-page>
        <section class="state-card" aria-labelledby="forbidden-title">
            <div class="state-card__mark" aria-hidden="true">403</div>
            <p class="auth-kicker">Access denied</p>
            <h1 id="forbidden-title" data-forbidden-title>Không có quyền truy cập</h1>
            <p id="forbidden-copy" data-forbidden-copy>Bạn không có quyền cho khu vực này. Dữ liệu và phiên của bạn vẫn được giữ an toàn.</p>
            <div class="state-card__actions"><a class="primary" href="/" aria-label="Về trang cửa hàng">Về cửa hàng</a><a class="secondary" href="/admin.html" data-forbidden-admin hidden>Về quản trị</a></div>
        </section>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
