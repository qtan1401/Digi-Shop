<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chi tiết sản phẩm — NodeShop">
    <title>Chi tiết sản phẩm | NodeShop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/product-gallery.css">
</head>
<body>
    <!-- BIỂU TƯỢNG (lucide) cho thanh điều hướng -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-shopping-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
        </defs>
    </svg>

    <!-- THANH ĐIỀU HƯỚNG -->
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-brand">NodeShop</a>
            <nav class="site-nav" aria-label="Chính">
                <a href="/">Trang chủ</a>
                <a href="/catalog.html">Sản phẩm</a>
            </nav>
            <ul class="site-header__actions">
                <li>
                    <a href="/cart.html" class="cart-nav-link" aria-label="Giỏ hàng">
                        <svg class="icon icon--20" aria-hidden="true"><use href="#i-shopping-cart"/></svg>
                        <span class="cart-badge cart-badge--hidden" id="cart-badge">0</span>
                    </a>
                </li>
                <li class="auth-nav" data-auth-nav aria-live="polite"></li>
            </ul>
        </div>
    </header>

    <!-- PRODUCT INFO -->
    <section class="product-info" id="product-info">
        <div class="loading">
            <div class="loading-spinner"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 NodeShop — Dự án học Node.js MVC
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/catalog-taxonomy.js"></script>
    <script src="/js/catalog-renderer.js"></script>
    <script src="/js/ui-icons.js"></script>
    <script src="/js/review-live.js"></script>
    <script src="/js/product-reviews.js"></script>
    <script src="/js/product_info.js"></script>
</html>
