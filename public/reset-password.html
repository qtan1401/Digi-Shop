<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đặt lại mật khẩu NodeShop">
    <meta name="referrer" content="no-referrer">
    <title>Đặt lại mật khẩu | NodeShop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <!-- BIỂU TƯỢNG (lucide) cho thanh điều hướng -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-shopping-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
        </defs>
    </svg>

    <!-- THANH ĐIỀU HƯỚNG -->
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-brand">NodeShop</a>
            <nav class="site-nav" aria-label="Chính">
                <a href="/">Trang chủ</a>
            </nav>
            <ul class="site-header__actions">
                <li>
                    <a href="/cart.html" class="cart-nav-link" aria-label="Giỏ hàng">
                        <svg class="icon icon--20" aria-hidden="true"><use href="#i-shopping-cart"/></svg>
                        <span class="cart-badge cart-badge--hidden" id="cart-badge">0</span>
                    </a>
                </li>
                <li class="auth-nav" data-auth-nav aria-live="polite"></li>
            </ul>
        </div>
    </header>
    <main class="state-main" data-reset-page>
        <section class="state-card" aria-labelledby="reset-title">
            <h1 id="reset-title">Đặt lại mật khẩu</h1>
            <div class="auth-message" data-auth-message role="status" aria-live="polite" hidden></div>
            <form class="auth-form" id="reset-form" novalidate hidden style="max-width:430px;margin:26px auto 0;text-align:left;">
                <div class="auth-field"><label for="reset-password">Mật khẩu mới</label><input id="reset-password" name="newPassword" type="password" autocomplete="new-password" minlength="6" required aria-describedby="reset-password-error"><span class="auth-field__error" data-field-error="newPassword" id="reset-password-error" aria-live="polite"></span></div>
                <div class="auth-field"><label for="reset-confirm">Nhập lại mật khẩu</label><input id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required aria-describedby="reset-confirm-error"><span class="auth-field__error" data-field-error="confirmPassword" id="reset-confirm-error" aria-live="polite"></span></div>
                <button class="auth-submit" type="submit">Đặt mật khẩu</button>
            </form>
            <div class="state-card__actions">
                <a class="primary" href="/auth.html" data-reset-login hidden>Đăng nhập</a>
                <a class="secondary" href="/recover.html" data-reset-again hidden>Gửi lại link</a>
            </div>
        </section>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
