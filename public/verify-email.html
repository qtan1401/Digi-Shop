<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xác minh email NodeShop">
    <title>Xác minh email | NodeShop</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <!-- BIỂU TƯỢNG (lucide) cho thanh điều hướng -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-shopping-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
        </defs>
    </svg>

    <!-- THANH ĐIỀU HƯỚNG -->
    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-brand">NodeShop</a>
            <nav class="site-nav" aria-label="Chính">
                <a href="/">Trang chủ</a>
                <a href="/catalog.html">Sản phẩm</a>
            </nav>
            <ul class="site-header__actions">
                <li>
                    <a href="/cart.html" class="cart-nav-link" aria-label="Giỏ hàng">
                        <svg class="icon icon--20" aria-hidden="true"><use href="#i-shopping-cart"/></svg>
                        <span class="cart-badge cart-badge--hidden" id="cart-badge">0</span>
                    </a>
                </li>
                <li class="auth-nav" data-auth-nav aria-live="polite"></li>
            </ul>
        </div>
    </header>
    <main class="state-main" data-verification-page>
        <section class="state-card" aria-labelledby="verification-title">
            <div class="state-card__mark" aria-hidden="true">@</div>
            <p class="auth-kicker">Email verification</p>
            <h1 id="verification-title">Kiểm tra hộp thư của bạn</h1>
            <p>Chúng tôi đã gửi liên kết xác minh tới <strong data-verification-email>địa chỉ email của bạn</strong>. Liên kết chỉ có hiệu lực trong 15 phút.</p>
            <p class="verify-meta">Thời gian còn lại: <span class="verify-countdown" data-verification-countdown aria-live="polite">15:00</span></p>
            <div class="auth-message" data-verification-status data-auth-message role="status" aria-live="polite" hidden></div>
            <div class="verify-actions">
                <button class="primary" type="button" data-check-verification>Tôi đã xác minh</button>
                <button type="button" data-resend-verification>Gửi lại email</button>
                <a class="auth-link" href="/auth.html" data-verification-login hidden>Đăng nhập</a>
            </div>
        </section>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
